[package]
name = "project"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "time"] }
axum = { version = "0.8.9", features = ["multipart"] }
tower-http = { version = "0.7.1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "migrate"] }
argon2 = "0.6.0"
email_address = "0.2.9"
dotenvy = "0.15.7"
getrandom = "0.4"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }

[dev-dependencies]
rand = "0.10.3"
tower = { version = "0.5", features = ["util"] }
