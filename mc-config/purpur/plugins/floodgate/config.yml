# Floodgate Spigot/Paper backend configuration
# Decrypts player data sent from Floodgate Velocity proxy using key.pem.
key-file-name: key.pem

username-prefix: "."

replace-spaces: true

disconnect:
  invalid-key: Please connect through the official Geyser
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

player-link:
  enabled: true
  require-link: false
  enable-own-linking: false
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: true

metrics:
  enabled: false

config-version: 3
