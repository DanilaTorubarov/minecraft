# Hardened AuthMe settings for an offline ("cracked") server.
#
# This is a PARTIAL config: it lists only the keys we deliberately change.
# AuthMe (via ConfigMe) fills in every other key from its own defaults on load
# and rewrites the complete file, so this stays small and survives AuthMe
# upgrades. The /config attach point overwrites the generated file each boot
# (SYNC_SKIP_NEWER_IN_DESTINATION=false), so these values always win.
#
# Deliberately NOT set here, because the AuthMe defaults are already correct for
# this setup — do not "improve" them without understanding the consequence:
#   settings.restrictions.allowChat: false          unauthenticated players cannot chat
#   settings.restrictions.allowMovement: false      ...or move
#   settings.restrictions.allowCommands             only /login, /register, /email,
#                                                   /captcha, /2fa, /totp. /website is
#                                                   deliberately absent: it must be
#                                                   impossible before authenticating.
#   settings.restrictions.ForceSingleSession: true  blocks the "logged in from
#                                                   another location" kick exploit
#   settings.restrictions.preventOtherCase: true    Bob/bob resolve to ONE offline
#                                                   UUID, so case variants must not
#                                                   be able to impersonate
#   settings.restrictions.kickOnWrongPassword: true
#   settings.restrictions.ProtectInventoryBeforeLogIn: true
#   settings.registration.force: true               only authenticated players play
#   settings.restrictions.enablePremium: false      premium auto-login is a bypass
#                                                   vector on an offline server

settings:
    restrictions:
        # Regex pattern of allowed characters in the player name.
        # Floodgate prepends '.' to Bedrock usernames (e.g. .Kokochi7232), so '.' must be allowed.
        allowedNicknameCharacters: '[a-zA-Z0-9_.]*'
        # Up to 100 in-game registrations may share one IP address (supports LAN, multi-account, and console players).
        maxRegPerIp: 100
        # A single IP may have up to 100 players logged in at once.
        maxLoginPerIp: 100
        # Same, for accounts allowed to join (registered or not).
        maxJoinPerIp: 100
        # Time in seconds players have to log in or register (300s / 5min for console/Xbox controller typing).
        loginTimeout: 300
        registerTimeout: 300
        # AuthMe can tell a player which other accounts share their IP. On a
        # cracked server that is free reconnaissance for an attacker.
        displayOtherAccounts: false

    security:
        # AuthMe's default is salted SHA-256, which is fast and therefore cheap
        # to brute-force if authme.db ever leaks. BCrypt is deliberately slow.
        passwordHash: BCRYPT
        # Match the website minimum: six characters for new/changed passwords.
        minPasswordLength: 6

    protection:
        # Sonar at the Velocity proxy handles bot mitigation and attack detection.
        # Disable AuthMe's secondary antiBot gate to avoid blocking console/Xbox reconnects.
        enableProtection: true
        enableAntiBot: false
        geoIpDatabase:
            enabled: false
        quickCommands:
            # Kicks bots that spam commands within 1000ms of connecting
            denyCommandsBeforeMilliseconds: 1000
