##                          ##
##         BlueMap          ##
##        Map-Config        ##
##                          ##

world: "world"
dimension: "minecraft:overworld"
name: "Overworld (3D)"
sorting: 0
start-pos: { x: 0, z: 0 }
sky-color: "#7dabff"
void-color: "#000000"
sky-light: 1
ambient-light: 0.15

# 2000 x 2000 blocks rendered core
render-mask: [
  {
    min-x: -1000
    max-x: 1000
    min-z: -1000
    max-z: 1000
  }
]

render-edges: true
edge-light-strength: 8

enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true

storage: "file"
