# Paper world overrides for the Nether.
#
# Engine Mode 1 (Ore Hiding) hides ancient debris and nether ores behind netherrack.
# 128 covers all accessible caverns up to the nether ceiling bedrock.

_version: 31
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 1
    hidden-blocks:
    - ancient_debris
    - nether_gold_ore
    - nether_quartz_ore
    max-block-height: 128
    lava-obscures: false
    replacement-blocks:
    - netherrack
    - basalt
    - blackstone
    update-radius: 2
    use-permission: false
