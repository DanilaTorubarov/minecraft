# World default settings for Paper / Purpur.
# Keys that are absent fall back to Paper's defaults.

_version: 31
anticheat:
  anti-xray:
    # Built-in asynchronous chunk obfuscation engine (Anti-Xray).
    #
    # Engine Mode 1: Ore Hiding.
    # Replaces unexposed ores in chunk packets with stone / deepslate before
    # sending them to the client. Real ores are invisible to X-ray texture
    # packs, ESP, and Freecam until exposed to air or transparent blocks.
    # Mode 1 creates no fake ore blocks, generates no artificial ore layers,
    # produces minimal chunk packet overhead, and is 100% stable with Geyser /
    # Bedrock crossplay clients.
    enabled: true
    engine-mode: 1
    # Obfuscate all underground and mountain layers up to Y=180 to cover
    # high mountain emerald, coal, and iron seams.
    max-block-height: 180
    lava-obscures: false
    update-radius: 2
    use-permission: false
    # Blocks that are hidden from the client when not exposed to air.
    hidden-blocks:
    - copper_ore
    - deepslate_copper_ore
    - raw_copper_block
    - coal_ore
    - deepslate_coal_ore
    - diamond_ore
    - deepslate_diamond_ore
    - emerald_ore
    - deepslate_emerald_ore
    - gold_ore
    - deepslate_gold_ore
    - raw_gold_block
    - iron_ore
    - deepslate_iron_ore
    - raw_iron_block
    - lapis_ore
    - deepslate_lapis_ore
    - redstone_ore
    - deepslate_redstone_ore
    - amethyst_block
    - budding_amethyst
    - chest
    - trapped_chest
    - ender_chest
    - spawner
    - tnt
    # In Mode 1, replacement-blocks are the solid blocks that hidden-blocks
    # are disguised as (stone and deepslate depending on depth).
    replacement-blocks:
    - stone
    - deepslate
