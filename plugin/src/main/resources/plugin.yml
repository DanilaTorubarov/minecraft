name: LinkBridge
version: '1.12.0'
main: dev.mcpanel.linkbridge.LinkBridgePlugin
description: Links a Minecraft account to a web panel account and reports per-player statistics and inventory snapshots to the panel.
api-version: '1.21'
# Hard dependency: the plugin calls AuthMeApi, and AuthMe must be enabled first.
depend: [AuthMe, SkinsRestorer]
softdepend: [BlueMap]
commands:
    services:
        description: Quote or confirm an optional iron-item repair after login.
        usage: /services repair [confirm] or /services travel
        permission: linkbridge.services
    quests:
        description: View or accept a personal mining, fishing, farming or hunting contract after login.
        usage: /quests [start [hunting|fishing|farming]]
        permission: linkbridge.quests
    balance:
        description: Show your Minecraft account's coin balance after login.
        usage: /balance
        aliases: [bal]
        permission: linkbridge.balance
    sell:
        description: List the item or stack in your main hand on the marketplace.
        usage: /sell <price> [price for stack]
        permission: linkbridge.sell
    market:
        description: Open the marketplace auction house to browse and buy items.
        usage: /market [page|search <query>]
        aliases: [ah]
        permission: linkbridge.market
    website:
        description: Link your Minecraft account or privately remind you of your website email.
        usage: /website link <code> or /website email
        permission: linkbridge.link
    ps:
        description: Purchase, place, manage and fuel your private protection cores.
        usage: /ps [buy|list|add <player>|remove <player>|info]
        aliases: [private, protection]
        permission: linkbridge.ps
    mine:
        description: Enter the 5-minute mining expedition cave dimension or check cooldown.
        usage: /mine [enter|time|leave|shop]
        permission: linkbridge.mine
    minershop:
        description: Buy Prospector Pickaxes to mine tiered fuel crystals.
        usage: /minershop [buy <tier 1-4>]
        permission: linkbridge.mine
    raid:
        description: Purchase and manage siege breach charges for raiding private zones.
        usage: /raid [buy|help]
        permission: linkbridge.ps
    mail:
        description: Check and claim deliveries and parcels sent from the website or other players.
        usage: /mail [claim|list]
        permission: linkbridge.mail
permissions:
    linkbridge.mail:
        description: Check and claim deliveries after authentication.
        default: true
    linkbridge.ps:
        description: Use private block protection commands after authentication.
        default: true
    linkbridge.mine:
        description: Enter the mining dimension and use the miners shop after authentication.
        default: true
    linkbridge.market:
        description: Open the marketplace auction house and buy items after authentication.
        default: true
    linkbridge.sell:
        description: Use /sell to list items on the marketplace after authentication.
        default: true
    linkbridge.services:
        description: Use personal economy services after authentication.
        default: true
    linkbridge.quests:
        description: View and accept your own quest objectives.
        default: true
    linkbridge.balance:
        description: Check your own coin balance after authentication.
        default: true
    linkbridge.link:
        description: Use /website link and /website email after authentication.
        default: true
