name: LinkBridge
version: '1.0.0'
main: dev.mcpanel.linkbridge.LinkBridgePlugin
description: Links a Minecraft account to a web panel account with a one-time code.
api-version: '1.21'
# Hard dependency: the plugin calls AuthMeApi, and AuthMe must be enabled first.
depend: [AuthMe]
commands:
    link:
        description: Link this Minecraft account to your panel account.
        usage: /link <code>
        permission: linkbridge.link
permissions:
    linkbridge.link:
        description: Use /link.
        default: true
