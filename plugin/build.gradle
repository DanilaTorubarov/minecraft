plugins {
    id 'java'
}

// Dedicated servers omit client textures. Package the official, version-matched
// item/block PNGs so JavaPlugin.getResource can actually find inventory artwork.
def textureVersion = '26.3' // Keep in step with paper-api below.
def textureCache = layout.projectDirectory.dir('../.plugin-build/client-textures')
def textureOutput = layout.buildDirectory.dir('generated/client-textures')
tasks.register('prepareItemTextures') {
    outputs.dir(textureOutput)
    inputs.property('minecraftVersion', textureVersion)
    doLast {
        def cache = textureCache.asFile
        cache.mkdirs()
        def fetch = { String url ->
            def connection = URI.create(url).toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 120000
            connection.inputStream.withCloseable { it.bytes }
        }
        def sha1 = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-1').digest(bytes).encodeHex().toString() }
        def metadata = new File(cache, "${textureVersion}.json")
        if (!metadata.exists()) {
            def manifest = new groovy.json.JsonSlurper().parse(fetch('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
            def versionEntry = manifest.versions.find { it.id == textureVersion }
            if (versionEntry == null) throw new GradleException("Unknown Minecraft version: ${textureVersion}")
            def bytes = fetch(versionEntry.url)
            if (sha1(bytes) != versionEntry.sha1) throw new GradleException('Minecraft metadata checksum mismatch')
            metadata.bytes = bytes
        }
        def client = new groovy.json.JsonSlurper().parse(metadata).downloads.client
        def jar = new File(cache, "${textureVersion}-client.jar")
        if (!jar.exists() || sha1(jar.bytes) != client.sha1) {
            def bytes = fetch(client.url)
            if (sha1(bytes) != client.sha1) throw new GradleException('Minecraft client checksum mismatch')
            jar.bytes = bytes
        }
        delete(textureOutput)
        copy {
            from zipTree(jar)
            include 'assets/minecraft/textures/item/**/*.png', 'assets/minecraft/textures/block/**/*.png'
            into textureOutput
        }
    }
}
sourceSets.main.resources.srcDir(textureOutput)
tasks.named('processResources') { dependsOn('prepareItemTextures') }

group = 'dev.mcpanel'
// Single source of truth for the version is plugin.yml; scripts/build-plugin.sh
// reads it and passes it in. Direct `gradle jar` runs get a placeholder.
version = findProperty('pluginVersion') ?: '0.0.0'

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://repo.bluecolored.de/releases') }
}

dependencies {
    // The server API. Pulled transitively (Adventure, annotations, bungee-chat,
    // guava, gson, ...) so javac can resolve the signatures it compiles against.
    // Keep in step with MC_VERSION in .env.docker.
    compileOnly 'io.papermc.paper:paper-api:26.3.build.193-stable'

    // BlueMap API for live 3D web map markers & territory integration
    compileOnly 'de.bluecolored:bluemap-api:2.8.2'
    compileOnly 'com.flowpowered:flow-math:1.0.3'

    // The server's own logging backend (2.26.0 ships in Purpur 26.3). The panel's
    // console terminal mirrors this stream; compiling against it keeps the appender
    // typed instead of reflective. Provided by the server at runtime.
    compileOnly 'org.apache.logging.log4j:log4j-api:2.26.0'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.26.0'

    // AuthMe and SkinsRestorer APIs
    compileOnly fileTree('../.plugin-build/lib') { include 'AuthMe-*.jar', 'SkinsRestorer-*.jar' }
}

// Nested codec tests need the plugin class's API types for JVM nest-host resolution.
configurations { testCompileOnly.extendsFrom compileOnly }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The backend runs Java 25 and paper-api 26.3 is built for it.
    options.release.set(25)
}

// Pure-Java regression checks exercise offline inventory edits without a server.
tasks.register('inventoryNbtTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'dev.mcpanel.linkbridge.InventoryNbtTest'
}
tasks.named('check') { dependsOn tasks.named('inventoryNbtTest') }
