<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let theme = 'system';
        try { const stored = localStorage.getItem('minecraft-theme'); theme = stored === 'light' || stored === 'dark' ? stored : 'system'; } catch {}
        document.documentElement.dataset.theme = theme === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <meta
      name="description"
      content="Link a website account to a Minecraft account on this server."
    />
    <title>Minecraft account</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
